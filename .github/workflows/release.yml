name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@1.96.1

      - uses: dtolnay/rust-toolchain@1.85.0

      - name: Install cargo-dist
        run: rustup run 1.96.1 cargo install cargo-dist --version 0.32.0 --locked

      - name: Install the Apple silicon target
        run: rustup target add aarch64-apple-darwin --toolchain 1.85.0

      - name: Build macOS release archives
        run: dist build --artifacts=all --tag "${{ github.event.release.tag_name }}"

      - name: Check release contents
        run: |
          test -f target/distrib/sha256.sum
          for archive in target/distrib/clockwork-*-apple-darwin.tar.gz; do
            test -f "$archive"
            tar -tzf "$archive" | grep -Eq '(^|/)clockwork$'
            tar -tzf "$archive" | grep -Eq '(^|/)install\.mjs$'
            tar -tzf "$archive" | grep -Eq '(^|/)services/clockwork/service\.sh$'
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" target/distrib/* install.sh --clobber
