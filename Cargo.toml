[package]
name = "clockwork"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
description = "Schedule agent runs and local commands"
license = "MIT"
readme = "README.md"
repository = "https://github.com/iurysza/clockwork"
homepage = "https://github.com/iurysza/clockwork"
keywords = ["scheduler", "cron", "cli", "automation", "agent"]
categories = ["command-line-utilities"]

[[bin]]
name = "clockwork"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
cron = "0.15"
nanoid = "0.4"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
fs4 = "0.12"
dirs = "6"
shell-words = "1"
url = "2"
ctrlc = "3"
libc = "0.2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["json"] }

[package.metadata.dist]
dist = true
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
unix-archive = ".tar.gz"
include = ["install.mjs", "services"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dist]
inherits = "release"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
